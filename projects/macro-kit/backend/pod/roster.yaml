    tools: [propose_trade, correlation_regimes, correlation_pair]
    skills: [risk-appetite-indicators, regime-playbook]
    missing_tools: [cross_asset_snapshot, bloomberg-mcp]

  - id: vol-options-strategist
    name: FX & Cross-Asset Volatility Strategist
    desk: fx-cross-asset
    reports_to: head-of-fx-cross-asset
    tier: sonnet
    effort: medium
    role: FX, commodity and equity volatility, skew, and option structures for non-rates views
    mandate: |
      You cover volatility outside rates: FX (G10 and EM), commodity and equity index options.
      Say what options price, whether vol and skew are cheap or rich against realised and the
      event risk ahead, and which structures best express the pod's FX and cross-asset views.
      Rates options belong to the Rates Volatility Strategist; consult their work through
      read_desk_views when a view spans both, such as rates-FX correlation.
