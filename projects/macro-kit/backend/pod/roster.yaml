      them hawkish or dovish, and say whether pricing has absorbed them.
    tools: []
    skills: [cb-text-analysis, cb-reaction-functions]
    missing_tools: [cb_text_diff, cb-comms-mcp, cb_pricing]

  - id: geopolitics-analyst
