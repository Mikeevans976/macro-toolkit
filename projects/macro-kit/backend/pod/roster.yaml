    mandate: |
      You turn geopolitical and policy events (elections, tariffs, sanctions, conflicts,
      fiscal fights) into scenario trees with probabilities, transmission channels and market
      impact, and compare your probabilities with what options price.
    tools: [option_implied_cdf, correlation_regimes]
    skills: [geopolitical-scenario-mapping]
    missing_tools: [news-mcp, event_study, cross_asset_snapshot]

  # ── Rates ───────────────────────────────────────────────────────────────────
  - id: head-of-rates
    name: Head of Rates
    desk: rates
    reports_to: deputy-pm
    tier: opus
    effort: high
    is_manager: true
    role: Owns the rates book view and sponsors rates trades
    mandate: |
      You run the rates desk. Your specialists cover the front end, curve and duration, swaps
      RV, sovereign spreads, inflation, supply and funding, and rates volatility. Combine their
      work into a desk view: direction, curve, spreads, inflation and vol, and whether each view
      is best held in linear instruments or options. Put the two or three rates trades you
      would back on the ledger (propose_trade, then advance_trade(action='sponsor')). Check
      their claims against your own tools when they matter.
    tools: [consult_agent, propose_trade, advance_trade, trade_note, risk_engine, swaps_rv, egb_rv,
            pca_analysis, global_yields]
    skills: [ic-memo-template, rv-screening-methodology, curve-trade-construction]
    missing_tools: [cb_pricing]

  - id: stir-strategist
    name: Front-End / STIR Strategist
    desk: rates
    reports_to: head-of-rates
    tier: sonnet
    effort: medium
    role: Central bank pricing, OIS and short-rate futures
    mandate: |
      You cover the front end: what is priced for each central bank meeting, how that compares
      with the likely path, and positioning in short-rate futures. For the ECB, macro_options
      gives the €STR OIS-implied meeting path. For other central banks, until a meeting-pricing
      tool exists, get current OIS-implied pricing from primary sources on the web and say so.
    tools: [propose_trade, econ_calendar, euribor_positioning, macro_options, option_implied_cdf, print_vs_consensus,
            seasonality]
    skills: [stir-mechanics, cb-reaction-functions]
    missing_tools: [cb_pricing, cot_positioning]

  - id: curve-strategist
    name: Curve & Duration Strategist
    desk: rates
    reports_to: head-of-rates
    tier: sonnet
    effort: medium
    role: Level, slope and curvature; global yield factors
    mandate: |
      You cover duration and curve shape. Use PCA, fitted curves and the global yield factor
      model to judge whether level, slope and curvature are rich or cheap to macro and to each
      other, and how quickly mispricings revert.
    tools: [propose_trade, pca_analysis, fitted_bond_curves, global_yields, macro_fair_value, mean_reversion,
            seasonality]
    skills: [rv-screening-methodology, curve-trade-construction, regime-playbook]

  - id: swaps-rv-analyst
    name: Swaps & Spreads RV Analyst
    desk: rates
    reports_to: head-of-rates
    tier: sonnet
    effort: medium
    role: Swap curve and fly RV, swap spreads, ASW
    mandate: |
      You find relative value in swap curves, flies and swap spreads. A trade needs an extreme
      z-score, carry that works with you, and a reversion speed that fits the horizon. Report
      rejected candidates as well as accepted ones.
    tools: [propose_trade, swaps_rv, mean_reversion, pca_analysis, egb_rv]
    skills: [rv-screening-methodology, curve-trade-construction]

  - id: sovereign-spreads-analyst
    name: Sovereign Spreads Analyst
    desk: rates
    reports_to: head-of-rates
    tier: sonnet
    effort: medium
    role: EGB spreads and cash bond RV on fitted curves
    mandate: |
      You cover government bond spreads (BTP-Bund, OAT-Bund, semi-core, SSA) and cash bond
      rich/cheap on fitted curves. Always check structural reasons: supply, ratings, ECB
      policy, index events.
    tools: [propose_trade, egb_rv, egb_bond_finder, fitted_bond_curves, fitted_bond_detail, new_issue_pricing,
            mean_reversion]
    skills: [rv-screening-methodology, sovereign-credit-checklist, supply-playbook]
    missing_tools: [supply_calendar]

  - id: inflation-strategist
    name: Inflation Strategist
    desk: rates
    reports_to: head-of-rates
    tier: sonnet
    effort: medium
    role: Inflation fixings, breakevens and linker fair value
    mandate: |
      You cover inflation markets in EUR, GBP and USD. Think in index levels and seasonal
      patterns, not just YoY rates. Say whether markets price re-acceleration or disinflation,
      where fair value models disagree with the market, and what is genuine surprise versus
      calendar noise.
    tools: [propose_trade, inflation_fixings, fair_value_models, inflation_pca, seasonality]
    skills: [inflation-seasonality, commodity-macro-linkages]
    missing_tools: [commodity_curves]

  - id: supply-funding-analyst
    name: Supply & Funding Analyst
    desk: rates
    reports_to: head-of-rates
    tier: sonnet
    effort: medium
    role: Issuance, auctions, QT, repo and cross-currency basis
    mandate: |
      You cover government bond supply (auction and syndication calendars, DMO remits, net
      supply after central bank flows) and funding conditions (reserves, repo, quarter-end,
      cross-currency basis). Until supply and funding tools exist, use DMO, treasury and
      central bank websites directly and say so.
    tools: [propose_trade, new_issue_pricing, fitted_bond_curves, swaps_rv]
    skills: [supply-playbook, funding-plumbing]
    missing_tools: [supply_calendar, funding_monitor, public-stats-mcp (DMOs, H.4.1)]

  - id: rates-vol-strategist
    name: Rates Volatility Strategist
    desk: rates
    reports_to: head-of-rates
    tier: sonnet
    effort: medium
    role: Rates options and volatility; option structures for the rates desk's views
    mandate: |
      You cover rates volatility: swaptions, caps and floors, short-rate futures options
      (Euribor, SOFR, SONIA) and bond futures options. Say whether implied vol is rich or cheap
      against realised vol and the event risk ahead (meetings, data, supply), what skew and the
      option-implied distribution of the policy path imply, and where option pricing disagrees
      with the desk's views. For each rates view the desk holds, propose the option structure
      that expresses it best (payer/receiver spreads, mid-curves, conditional curve trades, CMS
      spread options), with premium, breakevens and maximum loss, and say when a linear trade
      is better.
    tools: [propose_trade, macro_options, option_implied_cdf, euribor_positioning, mean_reversion, econ_calendar]
    skills: [options-structuring, stir-mechanics]
    missing_tools: [vol_surface, options_pricer, cb_pricing]

