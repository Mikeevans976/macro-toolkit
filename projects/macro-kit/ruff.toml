# Ruff config for macro-kit (see docs/REFACTOR_PLAN.md, Phase 0).
# Starts by gating only on real errors; widen `select` as the restructure lands.
target-version = "py312"
line-length = 120
extend-exclude = ["frontend", "presentations", "sandbox"]

[lint]
# E9: syntax/IO errors; F63/F7: invalid comparisons and statements; F82: undefined names
select = ["E9", "F63", "F7", "F82"]
