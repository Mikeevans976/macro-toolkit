  ust30:
    display_name: "US 30y Bond"
    roots: ["FUS"]
    bbg_root: "US"
    dv01_per_contract: 165.0
    currency: "USD"
    type: "bond"

  ust_ultra:
    display_name: "US Ultra Bond"
    roots: ["FWN"]
    bbg_root: "WN"
    dv01_per_contract: 185.0
    currency: "USD"
    type: "bond"

kalman:
  init_variance: 1.0e8         # large initial uncertainty
  lambda_init: 0.95            # starting value for optimisation
  beta_init: 1.0
  q_init: 1.0e4
  r_init: 1.0e5
  max_iter: 500
  r2_threshold: 0.30           # acceptance test threshold

migration:
  ratio_lower: 0.70            # Euribor ΔOI fall must be ≥70% matched by €STR rise
  ratio_upper: 1.30            # and ≤130% (beyond this it's new €STR longs, not migration)
  min_estr_oi_change: 500      # minimum absolute €STR OI increase to trigger flag
  correction_weight: 1.0       # fraction of matched migration to suppress (1.0 = full suppression)

options:
  expiry_dow: 4                # option expiry weekday: 4 = Friday (3rd Friday of month)
  expiry_week: 3               # 3rd occurrence
  ecb_proximity_days: 2        # flag within N calendar days of ECB meeting
  large_oi_move_pct: 0.02      # OI move > 2% of trailing mean OI triggers option flag
  option_downweight: 0.3       # flagged observations get w_adjusted multiplied by this
