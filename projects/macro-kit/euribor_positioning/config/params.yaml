    currency: "EUR"
    type: "bond"

  buxl:
    display_name: "Buxl 30y"
    roots: ["FUB"]
    bbg_root: "UB"
    dv01_per_contract: 220.0
    currency: "EUR"
    type: "bond"

  oat:
    display_name: "OAT 10y"
    roots: ["FOT"]
    bbg_root: "OAT"
    dv01_per_contract: 90.0
    currency: "EUR"
    type: "bond"

  btp:
    display_name: "BTP 10y"
    roots: ["FIK"]
    bbg_root: "IK"
    dv01_per_contract: 90.0
    currency: "EUR"
    type: "bond"

  ust2:
    display_name: "US 2y Note"
    roots: ["FTU"]
    bbg_root: "TU"
    dv01_per_contract: 43.0
    currency: "USD"
    type: "bond"

  ust5:
    display_name: "US 5y Note"
    roots: ["FFV"]
    bbg_root: "FV"
    dv01_per_contract: 48.0
    currency: "USD"
    type: "bond"

  ust10:
    display_name: "US 10y Note"
