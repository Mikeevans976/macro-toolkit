# Tool configuration for macro-kit (packaging comes later; see docs/REFACTOR_PLAN.md Phase 2).

[tool.pytest.ini_options]
# backend/ modules are imported top-level (e.g. `import main`, `from auth import ...`).
pythonpath = ["backend", "."]
testpaths = ["backend/tests", "euribor_positioning/tests"]
# backend/tests and euribor_positioning/tests are both packages named `tests`.
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["frontend", "presentations", "sandbox"]

[tool.ruff.lint]
# Gate on real errors only for now (syntax, invalid comparisons/statements, undefined names);
# widen as the restructure lands.
select = ["E9", "F63", "F7", "F82"]
