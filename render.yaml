services:
  - type: web
    name: analytics-hub
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANALYTICS_DATA_SOURCE
        value: simulation
      - key: SECRET_KEY
        generateValue: true   # Render generates a random secret automatically
      - key: ADMIN_USERNAME
        sync: false           # Set in Render dashboard — not stored in repo
      - key: ADMIN_PASSWORD
        sync: false           # Set in Render dashboard — not stored in repo
      - key: ADMIN_NAME
        sync: false           # Optional display name
